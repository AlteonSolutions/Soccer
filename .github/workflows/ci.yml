# Runs on every branch, not just the trunk: two of the four source projects had no CI at all and
# their only real regression check ran against nothing automatically.
#
# The `test` job is the gate. Any deploy job you add must declare `needs: test`.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json `packageManager`. Must run before
      # setup-node, whose `cache: pnpm` needs the pnpm binary on PATH.
      - uses: pnpm/action-setup@v4

      # 22 must equal package.json engines and any IaC runtime param.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile # frozen lockfile

      - name: Typecheck (all packages)
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm test

  # Deploys run only from main (a push, or a manual "Run workflow" on main to redeploy), only after
  # the gate, and only once the repository variable DEPLOY_ENABLED is "true" — set it after
  # docs/runbooks/first-deploy.md has created the Azure resources and the two secrets. Until then a
  # push to main is gated and goes nowhere.
  deploy-web:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @soccer/web run build
      # Everything is prebuilt and bundled, so the platform builds nothing.
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web/dist/client
          api_location: apps/web/dist/api
          skip_app_build: true
          skip_api_build: true

  deploy-reminders:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @soccer/reminders run build
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_REMINDERS_APP_NAME }}
          package: apps/reminders/dist
          publish-profile: ${{ secrets.AZURE_REMINDERS_PUBLISH_PROFILE }}
