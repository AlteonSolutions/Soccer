# Runs on every branch, not just the trunk: two of the four source projects had no CI at all and
# their only real regression check ran against nothing automatically.
#
# The `test` job is the gate. Any deploy job you add must declare `needs: test`.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json `packageManager`. Must run before
      # setup-node, whose `cache: pnpm` needs the pnpm binary on PATH.
      - uses: pnpm/action-setup@v4

      # 22 must equal package.json engines and any IaC runtime param.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile # frozen lockfile

      - name: Typecheck (all packages)
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm test
