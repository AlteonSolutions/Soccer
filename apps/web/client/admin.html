<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coach Admin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Coach Admin</h1>
      <p>
        <a href="/" style="color: inherit">Public Schedule</a> ·
        <a href="/logout" style="color: inherit">Sign Out</a>
      </p>
    </header>
    <main>
      <h2>Add A Game</h2>
      <form id="add-game" class="admin-form">
        <label>Date <input name="date" type="date" required /></label>
        <label>Kickoff <input name="kickoff" type="time" required /></label>
        <label>Opponent <input name="opponent" required maxlength="80" /></label>
        <label>Location <input name="location" required maxlength="120" /></label>
        <label>Notes <input name="notes" maxlength="300" placeholder="Optional" /></label>
        <button type="submit">Add Game</button>
      </form>
      <p id="status" class="status">Loading…</p>
      <h2>Games And Sign-Ups</h2>
      <table>
        <thead>
          <tr>
            <th>Game</th>
            <th>Snacks</th>
            <th>Email</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
