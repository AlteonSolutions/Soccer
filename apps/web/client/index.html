<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6cabdd" />
    <title>Snack Schedule</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="wrap">
        <img class="badge" src="/logo.svg" alt="" width="84" height="84" />
        <div>
          <p class="eyebrow">Snack Schedule</p>
          <h1 id="team-name">Loading…</h1>
          <p>Pick a game and bring the snacks. One family per game.</p>
        </div>
      </div>
    </header>
    <main>
      <p id="status" class="status">Loading the schedule…</p>
      <ul id="games" class="games"></ul>
    </main>
    <footer>
      Sign-ups use the email the coach has on file for each player. No address is ever shown on this
      site.
    </footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
