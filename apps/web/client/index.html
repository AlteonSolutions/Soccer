<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6cabdd" />
    <title>Snack Duty</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="wrap">
        <img class="badge" src="/logo.svg" alt="" width="84" height="84" />
        <div>
          <p class="eyebrow">Snack Duty</p>
          <h1 id="team-name">Loading…</h1>
        </div>
      </div>
    </header>
    <main>
      <p id="status" class="status">Loading the schedule…</p>
      <section id="intro" class="intro" hidden>
        <p class="headline">Let's be honest, for half the team the snacks are the main event!</p>
        <p class="ask">
          Thank you for pitching in – each game we need one family to bring snacks for the team
        </p>
        <p id="intro-team" class="team"></p>
      </section>
      <ul id="games" class="games"></ul>
    </main>
    <footer class="brand" hidden>
      <img id="wordmark" class="wordmark" alt="Snack Duty" />
    </footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
